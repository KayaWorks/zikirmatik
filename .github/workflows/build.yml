name: Build release AAB

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04  # image ships with the Android SDK
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - name: Restore upload keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/upload.jks"
            echo "KEYSTORE_FILE=$RUNNER_TEMP/upload.jks" >> "$GITHUB_ENV"
          else
            echo "::warning::KEYSTORE_BASE64 secret is not set; the release bundle will be unsigned."
          fi

      - name: Build signed bundle
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          VERSION_CODE: ${{ github.run_number }}
        run: |
          chmod +x gradlew
          set -o pipefail
          ./gradlew --no-daemon bundleRelease assembleDebug 2>&1 | tee build.log || {
            # Surface the failure reason as annotations so it shows on the run summary.
            msg=$( { grep -E "^e: |error:|ERROR:" build.log; sed -n '/What went wrong/,/\* Try:/p' build.log; } | head -60 | sed ':a;N;$!ba;s/\n/%0A/g')
            echo "::error::$msg"
            exit 1
          }

      - name: Verify bundle signature
        if: env.KEYSTORE_FILE != ''
        run: |
          out=$(jarsigner -verify -verbose -certs app/build/outputs/bundle/release/app-release.aab)
          echo "$out" | grep -q "jar verified" || { echo "::error::Bundle is not signed"; exit 1; }
          echo "::notice::Signed AAB: $(echo "$out" | grep -m1 -o 'CN=[^,]*'), versionCode ${{ github.run_number }}"

      - uses: actions/upload-artifact@v4
        with:
          name: zikirmatik-release-aab
          path: app/build/outputs/bundle/release/app-release.aab

      - uses: actions/upload-artifact@v4
        with:
          name: zikirmatik-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
